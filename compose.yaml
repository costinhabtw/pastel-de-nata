services:
  bot:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - pastel-data:/app/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pastel-data:
